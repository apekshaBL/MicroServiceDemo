server.port=8087
spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/student_service_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.hibernate.ddl-auto=none
hibernate.multi_tenant_connection_provider=user_service.common.config.MultiTenantConnectionProviderImpl

spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}


spring.datasource.driver-class-name=org.postgresql.Driver

# --- Disable Liquibase for User Service ---
# We disable this because auth-service already created the tables
spring.liquibase.enabled=false

# Consul Discovery
spring.cloud.consul.discovery.hostname=127.0.0.1

# Manually set the dialect so Hibernate doesn't need a startup connection
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Use the name of the consul container defined in docker-compose
spring.cloud.consul.host=consul-server
spring.cloud.consul.port=8500

# Tell Consul to use the container's internal Docker IP for health checks
spring.cloud.consul.discovery.prefer-ip-address=true

# Remove any hardcoded 127.0.0.1 or localhost settings